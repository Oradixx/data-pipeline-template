# Full stack: `cp .env.example .env && docker compose up -d --build`
#   db       TimescaleDB (PostgreSQL + time-series extension)
#   migrate  applies db/migrations once, then exits
#   ingest   streams data into the database, restarted if it crashes
#   grafana  dashboards on http://localhost:3000, already wired to the database

x-pipeline-env: &pipeline-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SOURCE_DEVICES: ${SOURCE_DEVICES:-5}
  SOURCE_INTERVAL_S: ${SOURCE_INTERVAL_S:-1.0}
  BATCH_SIZE: ${BATCH_SIZE:-500}
  BATCH_MAX_WAIT_S: ${BATCH_MAX_WAIT_S:-2.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # localhost only, never exposed publicly
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["migrate"]
    environment: *pipeline-env
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build: .
    command: ["ingest"]
    environment: *pipeline-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 10s  # time to flush the last batch on `docker compose stop`

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read by grafana/provisioning/datasources/timescaledb.yml
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
  grafana-data:
