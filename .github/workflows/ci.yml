name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit

  integration:
    name: Integration tests (TimescaleDB)
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.30.1-pg17
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: telemetry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipeline -d telemetry"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/telemetry
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Apply migrations
        run: uv run pipeline migrate
      - name: Ingest a few ticks
        run: uv run pipeline ingest --ticks 5
        env:
          SOURCE_INTERVAL_S: "0.1"
      - run: uv run pytest tests/integration --no-cov

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Ingestion writes rows
        run: |
          for i in $(seq 1 45); do
            rows=$(docker compose exec -T db psql -U pipeline -d telemetry -tAc \
              "SELECT count(*) FROM sensor_readings" 2>/dev/null || echo 0)
            echo "rows=${rows:-0}"
            [ "${rows:-0}" -gt 0 ] && exit 0
            sleep 2
          done
          exit 1
      - name: Grafana is up with the provisioned dashboard
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -u admin:change-me \
                http://localhost:3000/api/dashboards/uid/pipeline-overview \
                | grep -q '"Pipeline overview"'; then exit 0; fi
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
