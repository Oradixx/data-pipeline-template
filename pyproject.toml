[project]
name = "pipeline"
version = "0.1.0"
description = "Async ingestion of time-series data into TimescaleDB, visualised in Grafana."
readme = "README.md"
license = "MIT"
authors = [{ name = "Clément Vurpillot" }]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=pipeline --cov-report=term-missing"
markers = [
    "integration: needs a running TimescaleDB (DATABASE_URL); run with `make test-integration`",
]
